<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IAaaaaa - Assistente de IA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #173f32 0%, #07130f 45%, #030807 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 900px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 18px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 8px 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 45px;
      height: 45px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #28e58a, #0b8f59);
      font-size: 23px;
      box-shadow: 0 0 25px rgba(40, 229, 138, .25);
    }

    .logo h1 {
      font-size: 22px;
    }

    .logo span {
      display: block;
      color: #8aa79b;
      font-size: 12px;
      margin-top: 3px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #8aa79b;
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #28e58a;
      box-shadow: 0 0 10px #28e58a;
    }

    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding: 10px 0 20px;
    }

    .welcome {
      margin: auto;
      text-align: center;
      max-width: 650px;
      padding: 30px 15px;
    }

    .welcome-icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .welcome h2 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #91aaa0;
      line-height: 1.6;
      font-size: 15px;
    }

    .message {
      display: flex;
      width: 100%;
      animation: aparecer .2s ease;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.ai {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 82%;
      padding: 14px 16px;
      border-radius: 18px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 15px;
    }

    .user .bubble {
      background: linear-gradient(135deg, #159b61, #0d7148);
      border-bottom-right-radius: 5px;
    }

    .ai .bubble {
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.08);
      border-bottom-left-radius: 5px;
    }

    .typing {
      display: none;
      align-items: center;
      gap: 5px;
      color: #8aa79b;
      font-size: 13px;
      padding: 8px 5px;
    }

    .typing.show {
      display: flex;
    }

    .typing i {
      width: 6px;
      height: 6px;
      background: #28e58a;
      border-radius: 50%;
      animation: pulso 1s infinite;
    }

    .typing i:nth-child(2) {
      animation-delay: .15s;
    }

    .typing i:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes pulso {
      0%, 100% { opacity: .25; }
      50% { opacity: 1; }
    }

    .input-area {
      padding-top: 5px;
    }

    .input-box {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: rgba(12, 30, 24, .95);
      border: 1px solid rgba(40,229,138,.22);
      border-radius: 22px;
      padding: 10px;
      box-shadow: 0 10px 40px rgba(0,0,0,.3);
    }

    textarea {
      flex: 1;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-family: inherit;
      font-size: 15px;
      line-height: 1.5;
      min-height: 44px;
      max-height: 140px;
      padding: 11px 8px;
    }

    textarea::placeholder {
      color: #688077;
    }

    #send {
      width: 45px;
      height: 45px;
      flex-shrink: 0;
      border: 0;
      border-radius: 15px;
      background: linear-gradient(135deg, #28e58a, #0b9b5e);
      color: #032015;
      font-size: 20px;
      cursor: pointer;
      transition: .2s;
      font-weight: bold;
    }

    #send:hover {
      transform: scale(1.05);
    }

    #send:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none;
    }

    .footer {
      text-align: center;
      color: #526860;
      font-size: 10px;
      padding: 10px;
    }

    @media (max-width: 600px) {
      .app {
        padding: 10px;
      }

      header {
        padding: 10px 5px 15px;
      }

      .logo h1 {
        font-size: 19px;
      }

      .welcome h2 {
        font-size: 25px;
      }

      .bubble {
        max-width: 90%;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <div class="logo">
        <div class="logo-icon">✦</div>

        <div>
          <h1>IAaaaaa</h1>
          <span>Seu assistente inteligente</span>
        </div>
      </div>

      <div class="status">
        <div class="status-dot"></div>
        Online
      </div>
    </header>

    <main class="chat" id="chat">

      <div class="welcome" id="welcome">
        <div class="welcome-icon">🤖</div>

        <h2>Olá! Como posso ajudar?</h2>

        <p>
          Digite sua pergunta abaixo e converse com seu assistente
          de inteligência artificial.
        </p>
      </div>

      <div class="typing" id="typing">
        <i></i>
        <i></i>
        <i></i>
        Pensando...
      </div>

    </main>

    <div class="input-area">

      <div class="input-box">

        <textarea
          id="message"
          placeholder="Digite sua mensagem..."
          rows="1"
        ></textarea>

        <button id="send" title="Enviar">
          ➤
        </button>

      </div>

      <div class="footer">
        IAaaaaa • Assistente de inteligência artificial
      </div>

    </div>

  </div>


<script>

  const messageInput = document.getElementById("message");
  const sendButton = document.getElementById("send");
  const chat = document.getElementById("chat");
  const welcome = document.getElementById("welcome");
  const typing = document.getElementById("typing");

  let historico = [];


  function adicionarMensagem(texto, tipo) {

    if (welcome) {
      welcome.style.display = "none";
    }

    const mensagem = document.createElement("div");

    mensagem.className = "message " + tipo;

    const bolha = document.createElement("div");

    bolha.className = "bubble";

    bolha.textContent = texto;

    mensagem.appendChild(bolha);

    chat.insertBefore(mensagem, typing);

    chat.scrollTop = chat.scrollHeight;
  }


  async function enviarMensagem() {

    const texto = messageInput.value.trim();

    if (!texto) return;

    adicionarMensagem(texto, "user");

    historico.push({
      role: "user",
      content: texto
    });

    messageInput.value = "";

    ajustarTextarea();

    sendButton.disabled = true;

    typing.classList.add("show");

    try {

      /*
        IMPORTANTE:

        O endereço abaixo aponta para o servidor
        que vamos colocar na Vercel.

        Exemplo:

        https://seu-projeto.vercel.app/api/chat

        Depois que você criar o servidor,
        troque somente esta linha.
      */

      const resposta = await fetch("https://iaaaaaa-vercel.vercel.app/api/chat"),{
        

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          messages: historico
        })

      });


      const dados = await resposta.json();


      if (!resposta.ok) {

        throw new Error(
          dados.error || "Erro ao conversar com a IA."
        );

      }


      const respostaIA =
        dados.reply ||
        dados.message ||
        "Não consegui gerar uma resposta.";


      typing.classList.remove("show");

      adicionarMensagem(respostaIA, "ai");

      historico.push({
        role: "assistant",
        content: respostaIA
      });


    } catch (erro) {

      typing.classList.remove("show");

      adicionarMensagem(
        "Não consegui conectar com a IA agora. Verifique se o servidor está configurado corretamente.",
        "ai"
      );

      console.error(erro);

    } finally {

      sendButton.disabled = false;

      messageInput.focus();

    }

  }


  function ajustarTextarea() {

    messageInput.style.height = "auto";

    messageInput.style.height =
      Math.min(messageInput.scrollHeight, 140) + "px";

  }


  messageInput.addEventListener("input", ajustarTextarea);


  messageInput.addEventListener("keydown", function(event) {

    if (event.key === "Enter" && !event.shiftKey) {

      event.preventDefault();

      enviarMensagem();

    }

  });


  sendButton.addEventListener("click", enviarMensagem);

</script>

</body>
</html>
